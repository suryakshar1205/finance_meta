# ==============================================================================
# Central Configuration: Comparative and Hybrid Volatility Forecasting Framework
# ==============================================================================

project:
  name: "Comparative and Hybrid Financial Volatility Forecasting"
  version: "1.0.0"
  random_seed: 42

# --- Data Acquisition Settings ---
data:
  ticker: "^NSEI"               # Primary market: NIFTY 50 Index (Yahoo Finance)
  name: "NIFTY 50"
  backup_ticker: "NIFTY_50.NS"
  external_ticker: "SPY"        # External market for robustness evaluation (S&P 500 ETF)
  start_date: "2010-01-01"
  end_date: "2024-12-31"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  raw_file: "data/raw/nifty50_daily_raw.csv"
  processed_file: "data/processed/nifty50_daily_processed.csv"

# --- Feature & Volatility Parameters ---
features:
  annualization_factor: 252
  volatility_windows: [5, 10, 20, 30, 60]
  default_vol_window: 20
  return_lags: [1, 2, 3, 5, 10, 20]
  target_horizon: 5             # Primary forecast horizon (k=5 trading days)
  robustness_horizons: [1, 5, 10, 20]
  range_features: true
  volume_features: true

# --- Chronological Split Configuration ---
splits:
  train_start: "2010-01-01"
  train_end: "2018-12-31"
  val_start: "2019-01-01"
  val_end: "2020-12-31"
  test_start: "2021-01-01"
  test_end: "2024-12-31"

# --- Walk-Forward Validation Engine ---
walk_forward:
  scheme: "expanding"           # "expanding" or "rolling"
  initial_train_window: 1500    # Initial number of trading days in training set
  step_size: 1                  # Daily 1-step or k-step rolling prediction
  refit_interval: 20            # Re-estimate model parameters every 20 days (monthly)

# --- Econometric Models (GARCH) ---
garch:
  p: 1
  q: 1
  mean: "Constant"
  dist: "StudentsT"             # Heavy-tailed innovations for financial returns
  rescale: true                 # Rescale returns to percentage for numerical stability

# --- Machine Learning Models ---
ml_models:
  random_forest:
    n_estimators: 200
    max_depth: 6
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1

# --- Hybrid Model Architecture ---
hybrid:
  base_learner: "xgboost"       # ML regressor combining GARCH conditional vol + ML features
  include_garch_feature: true
  residual_learning: false      # Direct forecasting of target vol using GARCH forecast + features

# --- Economic Evaluation (Volatility Targeting) ---
portfolio:
  target_volatility: 0.15       # 15% annualized target volatility
  max_leverage: 1.5             # Maximum asset allocation leverage
  min_leverage: 0.0             # No shorting in base long-only index targeting
  risk_free_rate: 0.05          # 5.0% annual risk-free benchmark
  transaction_cost_bps: 10.0    # 10 bps (0.10%) per one-way turnover
  slippage_bps: 5.0             # 5 bps (0.05%) execution slippage
  initial_capital: 100000.0

# --- Results & Reporting Paths ---
results:
  forecasts_dir: "results/forecasts"
  tables_dir: "results/tables"
  figures_dir: "results/figures"
